<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 820"
     width="1200"
     height="820"
     role="img"
     aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Atlas Workbench architecture</title>
  <desc id="architecture-description">
    An optional scout emits pending public-source proposals for independent
    review. Public-source research and clearly marked synthetic fixtures pass
    through a provenance gateway into a six-phase LangGraph workflow: ingest,
    monitor, generate, prioritize, detect, and maintain. The workflow produces
    signal radar data, Atlas Briefs, pattern tests, and a governed scenario
    library for a review dashboard. Optional local oMLX inference and DriftLab
    runtime governance support the workflow.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0B1E35"/>
      <stop offset="1" stop-color="#10233B"/>
    </linearGradient>
    <linearGradient id="workflow-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112C48"/>
      <stop offset="1" stop-color="#0B213A"/>
    </linearGradient>
    <linearGradient id="dashboard-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173F58"/>
      <stop offset="1" stop-color="#102D43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6"
                    flood-color="#020815" flood-opacity="0.48"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55D6D0"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFCC66"/>
    </marker>
    <style>
      text {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
                     sans-serif;
      }
      .eyebrow {
        fill: #55D6D0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2.4px;
      }
      .title {
        fill: #F7FBFF;
        font-size: 31px;
        font-weight: 760;
        letter-spacing: 0.2px;
      }
      .subtitle {
        fill: #B9C9DA;
        font-size: 15px;
      }
      .section-label {
        fill: #DDEBFA;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.4px;
      }
      .card-title {
        fill: #FFFFFF;
        font-size: 15px;
        font-weight: 720;
      }
      .card-copy {
        fill: #BCD0E1;
        font-size: 12px;
      }
      .phase-number {
        fill: #071426;
        font-size: 12px;
        font-weight: 800;
        text-anchor: middle;
      }
      .phase-title {
        fill: #FFFFFF;
        font-size: 13px;
        font-weight: 760;
        letter-spacing: 0.6px;
      }
      .phase-copy {
        fill: #BED1E2;
        font-size: 11px;
      }
      .support-title {
        fill: #FFFFFF;
        font-size: 14px;
        font-weight: 720;
      }
      .support-copy {
        fill: #BFD0E0;
        font-size: 12px;
      }
      .flow {
        fill: none;
        stroke: #55D6D0;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-cyan);
      }
      .support-flow {
        fill: none;
        stroke: #FFCC66;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 6 7;
        marker-end: url(#arrow-amber);
      }
    </style>
  </defs>

  <rect width="1200" height="820" rx="26" fill="url(#background)"/>
  <path d="M 0 610 C 260 555, 430 690, 690 627 S 1000 570, 1200 648
           L 1200 820 L 0 820 Z"
        fill="#55D6D0" opacity="0.035"/>
  <circle cx="1090" cy="87" r="110" fill="#55D6D0" opacity="0.035"/>
  <circle cx="1106" cy="70" r="62" fill="none" stroke="#55D6D0"
          stroke-width="1" opacity="0.12"/>

  <text x="52" y="51" class="eyebrow">ATLAS WORKBENCH</text>
  <text x="52" y="88" class="title">Evidence to governed foresight</text>
  <text x="52" y="115" class="subtitle">
    A reviewable path from researched signals to operational-risk hypotheses
  </text>

  <!-- Evidence intake -->
  <g filter="url(#shadow)">
    <rect x="48" y="155" width="230" height="342" rx="18"
          fill="#0E263F" stroke="#335772" stroke-width="1.4"/>
  </g>
  <text x="70" y="184" class="section-label">EVIDENCE INTAKE</text>

  <rect x="70" y="207" width="186" height="74" rx="12"
        fill="#143550" stroke="#55D6D0" stroke-width="1.2"/>
  <circle cx="91" cy="229" r="7" fill="#55D6D0"/>
  <path d="M 87 229 L 90 232 L 96 225" fill="none" stroke="#071426"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="232" class="card-title">Public research</text>
  <text x="88" y="255" class="card-copy">Optional scout proposes leads</text>
  <text x="88" y="271" class="card-copy">Human research • cite • review</text>

  <rect x="70" y="296" width="186" height="74" rx="12"
        fill="#143550" stroke="#7AA8C4" stroke-width="1.2"/>
  <path d="M 86 316 L 96 316 L 101 325 L 96 334 L 86 334 L 81 325 Z"
        fill="#A8C8DA"/>
  <text x="111" y="326" class="card-title">Synthetic fixtures</text>
  <text x="88" y="349" class="card-copy">Explicitly fictional</text>
  <text x="88" y="365" class="card-copy">Safe for demonstrations</text>

  <rect x="70" y="395" width="186" height="76" rx="12"
        fill="#0A1D32" stroke="#FFCC66" stroke-width="1.4"/>
  <path d="M 88 420 L 98 415 L 108 420 V 429 C 108 437 102 442 98 444
           C 94 442 88 437 88 429 Z"
        fill="none" stroke="#FFCC66" stroke-width="1.7"/>
  <text x="119" y="424" class="card-title">Provenance gate</text>
  <text x="119" y="449" class="card-copy">Normalize • label • cite</text>

  <!-- Main workflow -->
  <path d="M 278 326 H 322" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="326" y="155" width="562" height="342" rx="18"
          fill="url(#workflow-panel)" stroke="#397397" stroke-width="1.5"/>
  </g>
  <text x="348" y="184" class="section-label">LANGGRAPH • SIX-PHASE WORKFLOW</text>
  <text x="866" y="184" class="card-copy" text-anchor="end">bounded state graph</text>

  <!-- Phase cards, arranged as a snake -->
  <g>
    <rect x="348" y="207" width="158" height="103" rx="13"
          fill="#173B58" stroke="#4E829F"/>
    <circle cx="369" cy="229" r="12" fill="#55D6D0"/>
    <text x="369" y="233" class="phase-number">1</text>
    <text x="390" y="233" class="phase-title">INGEST</text>
    <text x="365" y="260" class="phase-copy">Normalize records</text>
    <text x="365" y="278" class="phase-copy">Capture provenance</text>
    <text x="365" y="296" class="phase-copy">Structure evidence</text>

    <rect x="528" y="207" width="158" height="103" rx="13"
          fill="#173B58" stroke="#4E829F"/>
    <circle cx="549" cy="229" r="12" fill="#55D6D0"/>
    <text x="549" y="233" class="phase-number">2</text>
    <text x="570" y="233" class="phase-title">MONITOR</text>
    <text x="545" y="260" class="phase-copy">Classify drivers</text>
    <text x="545" y="278" class="phase-copy">Track signal maturity</text>
    <text x="545" y="296" class="phase-copy">Refresh risk register</text>

    <rect x="708" y="207" width="158" height="103" rx="13"
          fill="#173B58" stroke="#4E829F"/>
    <circle cx="729" cy="229" r="12" fill="#55D6D0"/>
    <text x="729" y="233" class="phase-number">3</text>
    <text x="750" y="233" class="phase-title">GENERATE</text>
    <text x="725" y="260" class="phase-copy">Map transmission</text>
    <text x="725" y="278" class="phase-copy">Add signposts + options</text>
    <text x="725" y="296" class="phase-copy">Judge and revise</text>

    <rect x="708" y="351" width="158" height="103" rx="13"
          fill="#173B58" stroke="#4E829F"/>
    <circle cx="729" cy="373" r="12" fill="#55D6D0"/>
    <text x="729" y="377" class="phase-number">4</text>
    <text x="750" y="377" class="phase-title">PRIORITIZE</text>
    <text x="725" y="404" class="phase-copy">Score assumptions</text>
    <text x="725" y="422" class="phase-copy">Rank materiality</text>
    <text x="725" y="440" class="phase-copy">Surface rationale</text>

    <rect x="528" y="351" width="158" height="103" rx="13"
          fill="#173B58" stroke="#4E829F"/>
    <circle cx="549" cy="373" r="12" fill="#55D6D0"/>
    <text x="549" y="377" class="phase-number">5</text>
    <text x="570" y="377" class="phase-title">DETECT</text>
    <text x="545" y="404" class="phase-copy">Test patterns</text>
    <text x="545" y="422" class="phase-copy">Challenge causality</text>
    <text x="545" y="440" class="phase-copy">Flag uncertainty</text>

    <rect x="348" y="351" width="158" height="103" rx="13"
          fill="#173B58" stroke="#4E829F"/>
    <circle cx="369" cy="373" r="12" fill="#55D6D0"/>
    <text x="369" y="377" class="phase-number">6</text>
    <text x="390" y="377" class="phase-title">MAINTAIN</text>
    <text x="365" y="404" class="phase-copy">Evaluate signposts</text>
    <text x="365" y="422" class="phase-copy">Refresh + recommend</text>
    <text x="365" y="440" class="phase-copy">Gate merge / retire</text>
  </g>

  <path d="M 506 258 H 521" class="flow"/>
  <path d="M 686 258 H 701" class="flow"/>
  <path d="M 787 310 V 344" class="flow"/>
  <path d="M 708 403 H 693" class="flow"/>
  <path d="M 528 403 H 513" class="flow"/>

  <!-- Research products -->
  <path d="M 888 326 H 923" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="927" y="155" width="225" height="342" rx="18"
          fill="#0E263F" stroke="#335772" stroke-width="1.4"/>
  </g>
  <text x="949" y="184" class="section-label">RESEARCH PRODUCTS</text>

  <rect x="949" y="207" width="181" height="66" rx="12"
        fill="#143550" stroke="#55D6D0"/>
  <path d="M 968 225 H 980 M 968 233 H 991 M 968 241 H 986"
        fill="none" stroke="#55D6D0" stroke-width="2" stroke-linecap="round"/>
  <text x="1003" y="232" class="card-title">Atlas Briefs</text>
  <text x="968" y="257" class="card-copy">Radar + ranked hypotheses</text>

  <rect x="949" y="287" width="181" height="66" rx="12"
        fill="#143550" stroke="#7AA8C4"/>
  <circle cx="974" cy="319" r="5" fill="#7AA8C4"/>
  <circle cx="994" cy="309" r="5" fill="#55D6D0"/>
  <circle cx="994" cy="331" r="5" fill="#FFCC66"/>
  <path d="M 979 317 L 989 311 M 979 321 L 989 329"
        fill="none" stroke="#AFC5D7" stroke-width="1.5"/>
  <text x="1011" y="315" class="card-title">Pattern tests</text>
  <text x="1011" y="335" class="card-copy">Findings + challenges</text>

  <rect x="949" y="367" width="181" height="104" rx="12"
        fill="#102C44" stroke="#FFCC66" stroke-width="1.4"/>
  <path d="M 968 391 H 982 V 403 H 968 Z M 972 387 H 986 V 399"
        fill="none" stroke="#FFCC66" stroke-width="1.7"/>
  <text x="998" y="397" class="card-title">Governed library</text>
  <text x="968" y="426" class="card-copy">Versioned • reviewable</text>
  <text x="968" y="445" class="card-copy">SQLite + JSON artifacts</text>

  <!-- Dashboard -->
  <path d="M 1039 497 V 530" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="641" y="534" width="511" height="109" rx="18"
          fill="url(#dashboard-card)" stroke="#55D6D0" stroke-width="1.6"/>
  </g>
  <rect x="668" y="558" width="134" height="60" rx="10"
        fill="#0B2135" stroke="#3D6C86"/>
  <path d="M 687 598 L 706 580 L 721 590 L 745 570 L 776 583"
        fill="none" stroke="#55D6D0" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="706" cy="580" r="3.5" fill="#FFCC66"/>
  <circle cx="745" cy="570" r="3.5" fill="#55D6D0"/>
  <text x="832" y="570" class="section-label">REVIEW DASHBOARD</text>
  <text x="832" y="597" class="card-title">Scan • brief • compare • challenge</text>
  <text x="832" y="620" class="card-copy">
    Human judgment owns every decision
  </text>

  <!-- Supporting layers -->
  <text x="48" y="687" class="section-label">OPTIONAL LOCAL SUPPORT</text>
  <g filter="url(#shadow)">
    <rect x="48" y="705" width="520" height="78" rx="15"
          fill="#111F34" stroke="#A47F34" stroke-width="1.2"/>
    <rect x="584" y="705" width="568" height="78" rx="15"
          fill="#111F34" stroke="#A47F34" stroke-width="1.2"/>
  </g>

  <circle cx="77" cy="744" r="15" fill="#FFCC66"/>
  <path d="M 70 745 L 76 751 L 85 737" fill="none" stroke="#071426"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="738" class="support-title">oMLX-compatible inference</text>
  <text x="104" y="760" class="support-copy">
    Operator-configured endpoint; local deployment is supported
  </text>

  <circle cx="613" cy="744" r="15" fill="#FFCC66"/>
  <path d="M 606 747 L 606 740 L 613 735 L 620 740 L 620 747 L 613 752 Z"
        fill="none" stroke="#071426" stroke-width="2"/>
  <text x="640" y="738" class="support-title">DriftLab runtime governance</text>
  <text x="640" y="760" class="support-copy">
    Trace capture, baseline comparison, and operational review signals
  </text>

  <path d="M 308 705 C 308 653, 406 640, 406 505" class="support-flow"/>
  <path d="M 868 705 C 868 656, 814 635, 814 505" class="support-flow"/>
</svg>
