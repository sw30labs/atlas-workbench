[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-workbench"
version = "0.2.0"
description = "A friendly, one-command workbench for evidence-grounded operational-risk scenarios."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Atlas Workbench contributors"},
]
requires-python = ">=3.12,<3.14"
keywords = [
    "banking",
    "operational-risk",
    "scenario-analysis",
    "foresight",
    "local-llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    # The ontology guard is fail-closed by default. Ship its runtime so a
    # plain `pip install` produces a working installation, not one that
    # blocks every write seam.
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "owlrl>=6.0",
]

[project.scripts]
atlas = "workbench_atlas.cli.main:main"
atlas-score = "workbench_atlas.scoring.cli:score_main"
atlas-eval = "workbench_atlas.scoring.cli:eval_main"
atlas-framework = "workbench_atlas.frameworks.cli:main"
atlas-export = "workbench_atlas.exports:main"

[project.urls]
Repository = "https://github.com/sw30labs/atlas-workbench"
Issues = "https://github.com/sw30labs/atlas-workbench/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# markitdown gates each format behind its own extra, so bare "markitdown"
# installs a converter that refuses every type the dashboard offers — and the
# failure message points back at this extra, which is a loop. Keep this list in
# step with MARKITDOWN_EXTENSIONS in workbench_atlas/ingest_artifacts.py.
ingest = ["markitdown[docx,pdf,pptx,xlsx]"]
# Kept as an alias so existing install lines (`.[ontology]`) keep working;
# these dependencies are now part of the base install.
ontology = ["rdflib>=7.0", "pyshacl>=0.25", "owlrl>=6.0"]
singularity = ["neo4j>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["workbench_atlas*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
workbench_atlas = [
    "baselines/*.json",
    "cli/*.yaml",
    "fixtures/*.json",
    "py.typed",
    "source_registry.yaml",
    "web/about.yaml",
    "web/static/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/*.svg",
]

# The ontology validator is intentionally a standalone script bundle: it must
# also run from a source checkout and in release automation.  Install the same
# tracked files at a stable, environment-relative data path for wheel users.
[tool.setuptools.data-files]
"share/workbench-atlas/ontology" = [
    "ontology/WIRING.md",
    "ontology/category-map.json",
    "ontology/domain.ttl",
    "ontology/export_existing.py",
    "ontology/guard.py",
    "ontology/shapes.ttl",
]
"share/workbench-atlas/ontology/fixtures" = [
    "ontology/fixtures/candidates.json",
    "ontology/fixtures/expected.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
